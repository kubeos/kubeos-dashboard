# Helm values for the upstream Headlamp chart, as used on a KubeOS node.
#
# Install with the chart version PINNED, because the chart default image tag is
# derived from appVersion and a moving chart can silently change both:
#   helm upgrade --install kubeos-dashboard headlamp \
#     --repo https://headlamp-k8s.github.io/headlamp/ \
#     --version 0.46.0 --namespace kubeos-system --create-namespace \
#     -f values.yaml

image:
  registry: ghcr.io
  repository: skmdab/headlamp
  # Our own tag: upstream + the KubeOS branding plugin, nothing else.
  tag: "kubeos-0.1.0"
  pullPolicy: IfNotPresent

config:
  inCluster: true
  inClusterContextName: "main"
  baseURL: ""
  sessionTTL: 86400

  # The server authenticates to the API with its own service account token, so
  # opening the dashboard asks for nothing. Pasting a token by hand was worse in
  # practice: the session lives in the browser, and every new browser or cleared
  # profile meant finding the 944-character JWT again.
  #
  # Two consequences that are not optional:
  #   * the pod's service account needs a binding (see "Authentication" in
  #     README.md). Without one the UI loads and every list is empty behind 403s.
  #   * anyone who can reach the NodePort *is* that service account. Keep 30443 on
  #     the management network and scope the binding down before this ships.
  unsafeUseServiceAccountToken: true

  pluginsDir: "/headlamp/plugins"
  watchPlugins: false

  # TLS is terminated by Headlamp itself. The certificate is generated per
  # machine at first boot and mounted from a Secret -- never shipped in the ISO.
  tlsCertPath: "/headlamp-cert/tls.crt"
  tlsKeyPath: "/headlamp-cert/tls.key"

# With TLS on, the probes must speak TLS too. The chart defaults them to HTTP and
# the server answers "client sent an HTTP request to an HTTPS server", so the pod
# never becomes Ready and the deployment crash-loops.
probes:
  scheme: HTTPS

# The plugin manager needs internet at runtime (npx @headlamp-k8s/pluginctl)
# and replaces /headlamp/plugins with an emptyDir. Both are wrong for an
# offline single-node box, and enabling it would hide the baked-in plugin.
pluginsManager:
  enabled: false

service:
  type: NodePort
  port: 80
  # Reachable on every node IP, i.e. https://<node>:30443
  nodePort: 30443

# Per-machine certificate, generated at first boot. Never shipped in the ISO.
volumes:
  - name: kubeos-cert
    secret:
      secretName: kubeos-dashboard-tls
volumeMounts:
  - name: kubeos-cert
    mountPath: /headlamp-cert
    readOnly: true
